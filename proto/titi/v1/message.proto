syntax = "proto3";

package titi.v1;

import "titi/v1/common.proto";

// Store-and-forward payloads; encrypted with the group key end to end.
message ChatMessage {
  bytes msg_uuid = 1;     // 16 bytes
  bytes group_uuid = 2;
  bytes sender_id = 3;
  uint64 sent_ms = 4;
  uint64 ttl_ms = 5;      // relays drop after sent_ms + ttl_ms
  oneof body {
    string text = 10;
    VoiceNote voice = 11;
    Location location = 12;
    Sos sos = 13;
  }
}

message VoiceNote {
  CodecProfile profile = 1;
  uint32 duration_ms = 2;
  bytes opus_packets = 3;  // length-prefixed (u16) opus packets
}

message Location {
  double lat = 1;
  double lon = 2;
  float accuracy_m = 3;
  float altitude_m = 4;
  float heading_deg = 5;
  float speed_mps = 6;
  bool breadcrumb = 7;
}

message Sos {
  Location location = 1;
  string note = 2;
  bool cancelled = 3;
}

message Ack {
  bytes msg_uuid = 1;
  bytes by = 2;
  uint64 ts_ms = 3;
}

// Relay-side inventory exchange for store-and-forward sync.
message Inventory {
  bytes group_uuid = 1;
  repeated bytes msg_uuids = 2;
}
