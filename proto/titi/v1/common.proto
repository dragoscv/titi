syntax = "proto3";

package titi.v1;

// Link classes, used by the core's cost model and by HELLO capabilities.
enum LinkClass {
  LINK_CLASS_UNSPECIFIED = 0;
  LINK_CLASS_LAN = 1;           // same Wi-Fi / hotspot, UDP
  LINK_CLASS_WIFI_AWARE = 2;    // NAN data path
  LINK_CLASS_NEARBY = 3;        // Google Nearby Connections (Android)
  LINK_CLASS_HOTSPOT = 4;       // LocalOnlyHotspot host/join
  LINK_CLASS_BLE_L2CAP = 5;
  LINK_CLASS_BLE_GATT = 6;
  LINK_CLASS_BT_RFCOMM = 7;
  LINK_CLASS_INTERNET = 8;      // WSS relay
  LINK_CLASS_WEBRTC = 9;        // web LAN mode data channel
}

// Voice codec profile carried in the voice header (3 bits) and in HELLO.
enum CodecProfile {
  CODEC_PROFILE_UNSPECIFIED = 0;
  CODEC_PROFILE_HQ = 1;   // Opus 24 kbps / 20 ms
  CODEC_PROFILE_STD = 2;  // Opus 16 kbps / 20 ms
  CODEC_PROFILE_LOW = 3;  // Opus 12 kbps / 40 ms, FEC
  CODEC_PROFILE_MIN = 4;  // Opus 8 kbps NB / 60 ms, FEC
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_ELEVATED = 2;
  PRIORITY_EMERGENCY = 3;
}

message NodeRef {
  bytes node_id = 1;      // 8 bytes: BLAKE2b-256(ed25519 pubkey)[0..8]
  bytes pubkey = 2;       // 32 bytes ed25519 (optional, present in ANNOUNCE/JOIN)
  string display_name = 3;
  uint32 avatar_hue = 4;  // 0..359
}

message LinkInfo {
  LinkClass class = 1;
  uint32 est_bps = 2;
  uint32 rtt_ms = 3;
  uint32 loss_pct = 4;
}
