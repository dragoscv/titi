# Weekly grouped updates so "latest stable" is the default, not an audit finding.
# Majors arrive as separate PRs (they need a migration read); CI gates every one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    open-pull-requests-limit: 10
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # types track the runtime (Node 24 on Vercel + Cloud Run)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /apps/backend
    schedule: { interval: weekly, day: monday }
    target-branch: dev
