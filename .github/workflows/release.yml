name: release

# Tag vX.Y.Z on main → Android AAB/APKs to Play internal track + desktop installers + GitHub Release.
# Web + relay ship on every push to main (deploy.yml); a tag pins store/binary releases.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag: { description: "existing tag to (re)release", required: true }

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ env.TAG }}" }
      - name: tag must be on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read, pull-requests: write }

  android:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      TITI_VERSION_NAME: ${{ inputs.tag || github.ref_name }}
      # Play already holds versionCode 1 from manual uploads; CI builds start above it.
      TITI_VERSION_CODE: ${{ github.run_number }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 22 }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: { toolchain: stable, targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: core }
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with: { tool: cargo-ndk }
      - run: |
          sudo apt-get install -y --no-install-recommends cmake ninja-build protobuf-compiler
          sdkmanager "ndk;28.2.13676358"
      - name: decode upload keystore
        shell: bash
        env: { KS: "${{ secrets.TITI_KEYSTORE_B64 }}" }
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TITI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - working-directory: android
        env:
          TITI_KEYSTORE_PASSWORD: ${{ secrets.TITI_KEYSTORE_PASSWORD }}
          TITI_KEY_PASSWORD: ${{ secrets.TITI_KEY_PASSWORD }}
          TITI_KEY_ALIAS: ${{ secrets.TITI_KEY_ALIAS }}
        run: ./gradlew --console=plain :app:bundleGmsRelease :wear:bundleRelease :tv:bundleRelease :app:assembleFossRelease
      - name: size budgets (release)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/size-budgets.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            android/app/build/outputs/bundle/gmsRelease/*.aab
            android/wear/build/outputs/bundle/release/*.aab
            android/tv/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/foss/release/*.apk
            android/app/build/outputs/mapping/gmsRelease/mapping.txt
      - name: Play internal track
        # set repo variable PLAY_UPLOAD=true once the Play service account secret exists
        if: vars.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ro.titi.app
          releaseFiles: android/app/build/outputs/bundle/gmsRelease/*.aab,android/wear/build/outputs/bundle/release/*.aab,android/tv/build/outputs/bundle/release/*.aab
          mappingFile: android/app/build/outputs/mapping/gmsRelease/mapping.txt
          track: internal
          status: completed

  desktop:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titi/desktop exec tauri build --bundles nsis
      - run: pwsh -NoProfile -File scripts/size-budgets.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: desktop, path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe }

  github-release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      - name: checksums
        run: find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.aab' \) -exec sha256sum {} + | sed 's|dist/[^ ]*/||' > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*-setup.exe
            dist/SHA256SUMS.txt
