name: deploy

# main = production. Runs the full CI first, then deploys relay (Cloud Run) and web (Vercel),
# then smoke-tests the LIVE deployment (authenticated path = real WSS relay + real browser).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read, pull-requests: write }

  relay:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      wss: ${{ steps.deploy.outputs.wss }}
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: deploy
        shell: pwsh
        env: { DEPLOY_SHA: "${{ github.sha }}" }
        run: pwsh -NoProfile -File scripts/deploy-backend.ps1 -Project ${{ vars.GCP_PROJECT }} -Region ${{ vars.GCP_REGION }} -GithubOutput

  web:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: deploy
        shell: bash
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta gitSha=${{ github.sha }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $url"

  smoke:
    needs: [relay, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: relay answers from the NEW revision
        shell: bash
        run: |
          body=$(curl -sSf "${{ needs.relay.outputs.url }}/health")
          echo "$body"
          echo "$body" | grep -q '"version":"${{ github.sha }}"' || { echo "health not served by ${{ github.sha }}"; exit 1; }
      - run: pnpm --filter @titi/backend exec tsx test/smoke.ts
        env: { TITI_RELAY_URL: "${{ needs.relay.outputs.url }}" }
      - run: pnpm --filter @titi/e2e exec playwright install --with-deps chromium
      - name: live browser smoke (two users join + chat over the prod relay)
        run: pnpm --filter @titi/e2e exec playwright test --project chromium --grep "@smoke|chat"
        env:
          E2E_BASE_URL: https://titi.dragoscatalin.ro
          E2E_RELAY_URL: ${{ needs.relay.outputs.wss }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: prod-smoke-report, path: e2e/playwright-report, retention-days: 14 }
