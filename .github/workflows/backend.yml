name: backend

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "packages/protocol/**", "proto/**", "pnpm-lock.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "packages/protocol/**", "proto/**", "pnpm-lock.yaml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titi/backend typecheck
      - run: pnpm --filter @titi/backend test
      - run: pnpm --filter @titi/backend build
      - run: docker build -f apps/backend/Dockerfile -t titi-relay:ci .

  deploy:
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud builds submit --project "${{ vars.GCP_PROJECT }}" --region europe-west1 --config apps/backend/cloudbuild.yaml --substitutions "_IMAGE=europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/titi/titi-relay:${{ github.sha }}" .
      - run: >
          gcloud run deploy titi-relay --project "${{ vars.GCP_PROJECT }}" --region europe-west1
          --image "europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/titi/titi-relay:${{ github.sha }}"
          --platform managed --allow-unauthenticated --port 8080 --execution-environment gen2
          --session-affinity --timeout 3600 --min-instances 0 --max-instances 3 --concurrency 250
      - run: curl -fsS "$(gcloud run services describe titi-relay --project "${{ vars.GCP_PROJECT }}" --region europe-west1 --format 'value(status.url)')/health"
