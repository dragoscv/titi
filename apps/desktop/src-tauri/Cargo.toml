[package]
name = "titi-desktop"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"
description = "Titi desktop (Windows / macOS / Linux): Tauri 2 shell around the native Rust engine"

[lib]
name = "titi_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "titi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
titi-core = { path = "../../../core/titi-core", features = ["opus", "json"] }
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
cpal = "0.18.2"
parking_lot = "0.12.5"
log = "0.4.34"
env_logger = "0.11.11"
dirs = "7.0.0"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
] }

[features]
# `tauri dev` passes this so the webview points at Vite
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
