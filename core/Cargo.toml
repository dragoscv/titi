[workspace]
resolver = "2"
members = ["titi-core", "titi-ffi", "titi-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
titi-core = { path = "titi-core", default-features = false }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver"] }
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
argon2 = "0.6.0"
blake2 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
hmac = "0.13.0"
digest = "0.11.0"
rand_core = { version = "0.9", features = ["os_rng"] }
getrandom = { version = "0.4.3" }
lru = "0.18.4"
prost = "0.14.4"
prost-build = "0.14.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
opus = "0.4.0"
uniffi = "0.32.1"
wasm-bindgen = "0.2.128"
js-sys = "0.3"

# Fast dev/test loops: small debug info for our crates, optimised deps (argon2,
# dalek, libopus via cmake) so tests don't crawl; build scripts/proc-macros at O3.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
