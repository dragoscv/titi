# cargo-deny: advisories, licence compatibility with AGPL-3.0, duplicate/banned crates, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # basic-toml: unmaintained (archived 2025-03), build-time only via uniffi_bindgen → askama;
  # parses our own uniffi.toml, never untrusted input. No upgrade upstream yet (2026-10-30).
  { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi_bindgen/askama; no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "0BSD", "AGPL-3.0-only", "AGPL-3.0-or-later", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
