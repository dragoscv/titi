# XcodeGen spec — run `xcodegen generate` on macOS (CI). *.xcodeproj is gitignored.
name: Titi
options:
  bundleIdPrefix: ro.titi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Titi/Resources/Localizable.xcstrings (en + ro) ships via the Titi source glob.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  TitiCore:
    path: TitiCore
targets:
  Titi:
    type: application
    platform: iOS
    sources:
      - path: Titi
    resources:
      - path: Titi/Resources
    dependencies:
      - package: TitiCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Titi/Info.plist
      properties:
        CFBundleDisplayName: Titi
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIAppFonts: [Manrope-Medium.ttf, Manrope-Bold.ttf, Manrope-ExtraBold.ttf, GeistMono-Medium.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, bluetooth-central, bluetooth-peripheral, push-to-talk]
        NSMicrophoneUsageDescription: Titi transmits your voice to your group.
        NSBluetoothAlwaysUsageDescription: Titi finds nearby phones over Bluetooth when there is no Wi‑Fi.
        NSLocalNetworkUsageDescription: Titi talks to phones on the same Wi‑Fi or hotspot.
        NSBonjourServices: [_titi._udp]
        NSCameraUsageDescription: Scan a Titi invite QR code.
        NSLocationWhenInUseUsageDescription: Only to share your position or an SOS with your group.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [titi]
            CFBundleURLName: ro.titi.join
    entitlements:
      path: Titi/Titi.entitlements
      properties:
        com.apple.developer.associated-domains: [applinks:titi.dragoscatalin.ro, applinks:titi.app]
        com.apple.developer.push-to-talk: true
        com.apple.developer.networking.multicast: true
        com.apple.developer.networking.wifi-aware: [titi]
  TitiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TitiTests]
    dependencies:
      - target: Titi
      - package: TitiCore
