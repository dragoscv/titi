# XcodeGen spec — run `xcodegen generate` on macOS (CI). *.xcodeproj is gitignored.
name: Titi
options:
  bundleIdPrefix: ro.titi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # Swift 5 language mode + complete checking: concurrency findings are warnings while the
    # first device builds land (uniffi bindings and delegate-heavy Apple APIs); tighten to 6 later.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Titi/Resources/Localizable.xcstrings (en + ro) ships via the Titi source glob.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # The Rust xcframework ships arm64 device + arm64 simulator only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  TitiCore:
    path: TitiCore
schemes:
  Titi:
    build:
      targets:
        Titi: all
    test:
      targets: [TitiTests]
targets:
  Titi:
    type: application
    platform: iOS
    sources:
      - path: Titi
      - path: Shared
    dependencies:
      - package: TitiCore
      - target: TitiWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.titi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Titi/Info.plist
      properties:
        CFBundleDisplayName: Titi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro]
        # Own end-to-end crypto (Noise XX/XXpsk3, ChaCha20-Poly1305, X25519): non-exempt, standard algorithms.
        ITSAppUsesNonExemptEncryption: true
        LSApplicationCategoryType: public.app-category.social-networking
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIAppFonts: [Manrope-Medium.ttf, Manrope-Bold.ttf, Manrope-ExtraBold.ttf, GeistMono-Medium.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, bluetooth-central, bluetooth-peripheral, push-to-talk]
        NSMicrophoneUsageDescription: Titi transmits your voice to your group.
        NSBluetoothAlwaysUsageDescription: Titi finds nearby phones over Bluetooth when there is no Wi‑Fi.
        NSLocalNetworkUsageDescription: Titi talks to phones on the same Wi‑Fi or hotspot.
        NSCameraUsageDescription: Scan a Titi invite QR code.
        NSLocationWhenInUseUsageDescription: Only to share your position or an SOS with your group.
        NFCReaderUsageDescription: Write a Titi invite to an NFC tag so friends can tap to join.
        # SOS Live Activity (drawn by the TitiWidgets extension, iOS 18+).
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [titi]
            CFBundleURLName: ro.titi.join
    entitlements:
      path: Titi/Titi.entitlements
      properties:
        # Multicast (LAN discovery) and Wi-Fi Aware need Apple approval: added back once granted.
        com.apple.developer.associated-domains: [applinks:titi.dragoscatalin.ro]
        com.apple.developer.push-to-talk: true
        # SOS banners from other members break through Focus.
        com.apple.developer.usernotifications.time-sensitive: true
        # NFCNDEFReaderSession tag writing (invite link). Apple lists TAG as the only accepted value; "NDEF" fails export.
        com.apple.developer.nfc.readersession.formats: [TAG]
        # Xcode export for App Store rewrites this to production.
        aps-environment: development
  TitiWidgets:
    # Control Center "Talk" control + SOS Live Activity. iOS 18 so ControlWidget needs no availability gates;
    # on iOS 17 the app runs without it.
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TitiWidgets
      - path: Shared
      # Generated brand colours (brand/scripts/tokens.mjs writes this path) and the en+ro string catalog.
      - path: Titi/BrandTokens.swift
      - path: Titi/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.titi.app.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: TitiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Titi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TitiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TitiTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.titi.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Titi
      - package: TitiCore
