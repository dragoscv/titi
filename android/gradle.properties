org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Rust Exec tasks capture script refs; enable config cache once they are moved to a plugin.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Rust core: set to "false" to skip cargo-ndk (uses prebuilt jniLibs if present)
titi.buildRust=true
# Comma-separated ABIs to build; debug builds only arm64 for speed
titi.rustAbis.debug=arm64-v8a
titi.rustAbis.release=arm64-v8a,armeabi-v7a,x86_64
