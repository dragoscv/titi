org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Rust Exec tasks use `enabled = <Boolean>` (not onlyIf lambdas) so they are CC-safe.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Rust core: set to "false" to skip cargo-ndk (uses prebuilt jniLibs if present)
titi.buildRust=true
# Comma-separated ABIs to build. Galaxy Watch 7 reports armeabi-v7a only (32-bit userland),
# so debug builds include it; pass -Ptiti.rustAbis.debug=arm64-v8a for a phone-only fast loop.
titi.rustAbis.debug=arm64-v8a,armeabi-v7a
titi.rustAbis.release=arm64-v8a,armeabi-v7a,x86_64

# JDKs outside JAVA_HOME for daemon-JVM matching (gradle/gradle-daemon-jvm.properties pins 22)
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-22
