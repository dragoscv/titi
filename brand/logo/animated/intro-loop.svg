@keyframes titi-morph-eye {
  0% { scale: 1; }
  30% { scale: 0; }
  100% { scale: 0; }
}
.titi-mark[data-mark-state="morph"] [data-part="eye"] { transform-origin: 26.2px 22.4px; animation: titi-morph-eye 420ms cubic-bezier(0.05, 0.7, 0.1, 1) 1 forwards; }
@keyframes titi-morph-arc {
  0% { scale: 1; opacity: 1; }
  70% { scale: 1.3; opacity: 0; }
  100% { scale: 1.3; opacity: 0; }
}
.titi-mark[data-mark-state="morph"] [data-part="arc"] { transform-origin: 22px 26px; animation: titi-morph-arc 420ms cubic-bezier(0.05, 0.7, 0.1, 1) 1 forwards; }
@keyframes titi-morph-body {
  0% { scale: 1; }
  25% { scale: 1; }
  100% { scale: 1.55; }
}
.titi-mark[data-mark-state="morph"] [data-part="body"] { transform-origin: 22px 26px; animation: titi-morph-body 420ms cubic-bezier(0.05, 0.7, 0.1, 1) 1 forwards; }
@media (prefers-reduced-motion: reduce) {
  .titi-mark [data-part] { animation: none !important; }
  .titi-mark[data-mark-state="talking"] [data-part="arc2"] { opacity: 1; }
}
