<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.9 0.6 48.8 48.8" class="titi-mark" data-mark-state="intro" role="img" aria-label="Titi"><style>.titi-mark [data-part] { transform-box: view-box; }
.titi-mark [data-part="mark"] { transform-origin: 22px 26px; }
.titi-mark [data-part="body"] { transform-origin: 22px 26px; }
.titi-mark [data-part="tail"] { transform-origin: 12px 38px; }
